version: "3.9"

services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
    networks:
      - test-network

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    working_dir: /home/dynamodblocal
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -X POST http://localhost:8000/ -H 'X-Amz-Target: DynamoDB_20120810.ListTables' -H 'Content-Type: application/x-amz-json-1.0' -d '{}' >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 3s

  dynamodb-init:
    image: python:3.11-slim
    container_name: dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - test-network
    environment:
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-east-1"
    volumes:
      - ./app_scripts:/scripts
    command: ["/bin/bash", "/scripts/init_dynamodb.sh"]

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin        # dev only
      MINIO_ROOT_PASSWORD: minioadmin    # dev only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data                 # persistent storage for objects
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - test-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/kyc-documents --ignore-existing;
      mc anonymous set download local/kyc-documents;
      echo 'MinIO bucket kyc-documents created successfully';
      exit 0;
      "

  app:
    build: ./app
    container_name: kyc-api
    depends_on:
      vault:
        condition: service_started
      dynamodb-local:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"               # dev only
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      AWS_ACCESS_KEY_ID: "dummy"        # required by boto3, but ignored by dynamodb-local
      AWS_SECRET_ACCESS_KEY: "dummy"    # same
      AWS_REGION: "us-east-1"
      # ShuftiPro callback URL loaded from .env file
      # Set SHUFTIPRO_CALLBACK_URL in .env to enable webhooks
      
      # --- MinIO / S3 config for the app ---
      S3_ENDPOINT: "http://minio:9000"        # internal DNS from Docker network
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"  # public endpoint for presigned URLs
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_NAME: "kyc-documents"         # bucket name
      S3_FORCE_PATH_STYLE: "true"             # important for MinIO-style endpoints
    ports:
      - "8181:8181"
    volumes:
      - ./documents:/app/documents
    networks:
      - test-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://kyc-api:8181
    networks:
      - test-network
    restart: unless-stopped

volumes:
  vault-data:
  minio-data:

networks:
  test-network:
    driver: bridge
